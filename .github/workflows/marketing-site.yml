name: Marketing site

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "docs-site/**"
      - "scripts/build-site.ts"
      - "scripts/serve-site.ts"
      - "screenshot.png"
      - "preview.png"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/marketing-site.yml"
  pull_request:
    paths:
      - "website/**"
      - "docs-site/**"
      - "scripts/build-site.ts"
      - "scripts/serve-site.ts"
      - "screenshot.png"
      - "preview.png"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/marketing-site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.x

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Configure Pages
        id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build marketing site
        run: bun run site:build
        env:
          SITE_URL: ${{ github.event_name == 'pull_request' && 'https://403access.github.io/downlink' || steps.pages.outputs.base_url }}

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
